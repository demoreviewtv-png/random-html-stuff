<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Page title -->
    <title>Dih Mansion</title>
    <style>
      /* Reset default margins and padding */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      /* Body styling with full-screen background image */
      body {
        /* Mansion background image */
        background-image: url('https://hgtvhome.sndimg.com/content/dam/images/hgtv/fullset/2022/5/16/0/HUHH2022_Global-Homes_Canada-09.jpg.rend.hgtvcom.791.527.85.suffix/1652726262349.webp');
        /* Cover entire viewport, cutting off edges as needed */
        background-size: cover;
        /* Fix background to viewport (doesn't scroll) */
        background-attachment: fixed;
        /* Don't repeat the image */
        background-repeat: no-repeat;
        /* Center the background image */
        background-position: center;

        /* Text styling */
        color: #0F0F0F;
        font-size: 20px;
        font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
      }

      /* translucent overlay to improve text readability */
      .overlay {
        background-color: rgba(255, 255, 255, 0.75);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }

      /* Paragraph styling */
      p {
        font-size: 15px;
        margin: 0;
      }

      /* Heading styling */
      h1 {
        margin-top: 0;
        margin-bottom: 0.5rem;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
      }

      /* Make sure things remain accessible for users who reduce motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0 !important;
          animation-duration: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <!-- Main heading -->
      <h1>Adam the Wolf's Mansion</h1>
      <!-- Subtitle -->
      <p>Aka The Dih Mansion</p>
    </div>
  </body>
</html>
